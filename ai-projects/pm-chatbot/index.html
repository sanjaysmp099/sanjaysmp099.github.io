<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="chat-wrapper">
    <header class="chat-header">
      <h1>PM Assistant</h1>
      <p>Runs entirely in your browser — open-source model, no server</p>
    </header>

    <div id="chat-log" class="chat-log">
      <div class="message bot">
        Hi! I can answer questions about project management — Agile, Scrum,
        risk, scheduling, stakeholders, and more. Ask me anything in that space.
      </div>
    </div>

    <div id="status" class="status hidden"></div>
    <div id="progress-track" class="progress-track hidden">
      <div id="progress-bar" class="progress-bar"></div>
    </div>

    <form id="chat-form" class="chat-form">
      <input
        id="chat-input"
        type="text"
        placeholder="Loading model, please wait..."
        autocomplete="off"
        disabled
        required
      />
      <button type="submit" disabled>Send</button>
    </form>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
